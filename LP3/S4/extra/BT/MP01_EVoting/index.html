<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voting Lab | SPPU</title><style>:root{color-scheme:dark}body{font:16px system-ui;background:#0b1020;color:#e4e8f4;max-width:800px;margin:7vh auto;padding:1rem}h1{font-size:2rem}button,input,select{background:#192338;color:#fff;border:1px solid #4f6ca1;border-radius:8px;padding:12px;margin:8px 4px 8px 0}input{width:min(90%,430px)}button{cursor:pointer}article{border:1px solid #293857;padding:20px;border-radius:16px;margin:18px 0}small{color:#abb7cc}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><p><small>SPPU · Group C · Mini-project #7</small></p><h1>Educational E-Voting dApp</h1><p>Deploy <code>Voting.sol</code> in Remix on a wallet-accessible test network first. Use test Ether only. One wallet is not one verified person.</p><article><button id="connect">Connect MetaMask</button><p id="wallet">Not connected</p><input id="address" placeholder="Paste deployed Voting contract address"/><button id="load">Load election</button></article><article><h2>Election</h2><p id="phase">Not loaded</p><select id="candidate"><option value="">Load candidates</option></select><button id="vote">Submit vote</button><button id="refresh">Refresh results</button><pre id="results"></pre></article><p id="status" role="status"></p><script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script><script>
const $=id=>document.getElementById(id);const abi=['function phase() view returns(uint8)','function getCandidateCount() view returns(uint256)','function getCandidate(uint256) view returns(string,uint256)','function hasVoted(address) view returns(bool)','function vote(uint256)','function totalVotes() view returns(uint256)'];let signer,contract;
function status(t){$('status').textContent=t}
function error(e){status('Error: '+(e.shortMessage||e.message||String(e)))}
$('connect').onclick=async()=>{try{if(!window.ethereum)throw Error('MetaMask not detected');if(!window.ethers)throw Error('Ethers library unavailable: check internet');const provider=new ethers.BrowserProvider(window.ethereum);await provider.send('eth_requestAccounts',[]);signer=await provider.getSigner();$('wallet').textContent=await signer.getAddress();status('Wallet connected')}catch(e){error(e)}};
$('load').onclick=async()=>{try{if(!signer)throw Error('Connect wallet first');const addr=$('address').value.trim();if(!ethers.isAddress(addr))throw Error('Invalid contract address');contract=new ethers.Contract(addr,abi,signer);await refresh();status('Contract loaded')}catch(e){error(e)}};
async function refresh(){if(!contract)throw Error('Load contract first');const names=['Created','Open','Closed'];const phase=Number(await contract.phase());$('phase').textContent='Phase: '+names[phase];const count=Number(await contract.getCandidateCount());const select=$('candidate');select.replaceChildren();let lines=[];for(let i=0;i<count;i++){const [name,votes]=await contract.getCandidate(i);let opt=document.createElement('option');opt.value=i;opt.textContent=name;select.append(opt);lines.push(name+': '+votes+' votes')} $('results').textContent=lines.join('\n')+'\nTotal votes: '+(await contract.totalVotes());}
$('vote').onclick=async()=>{try{if(!contract)throw Error('Load contract first');status('Waiting for wallet approval and transaction confirmation...');const tx=await contract.vote(Number($('candidate').value));await tx.wait();await refresh();status('Vote confirmed on the network')}catch(e){error(e)}};
$('refresh').onclick=async()=>{try{await refresh();status('Results updated')}catch(e){error(e)}};
</script></body></html>
